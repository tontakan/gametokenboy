<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Frost</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* Prevent scroll on touch devices */
            user-select: none; /* Prevent text selection on rapid tap for mobile */
            -webkit-user-select: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.5);
            border-radius: 10px;
            /* Border for visual style, like in the video */
            border: 2px solid #0055ff;
            background: linear-gradient(to bottom, #001133, #003366);
        }
        
        /* UI Overlays */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 10;
            border-radius: 10px;
        }
        
        .hidden {
            display: none !important;
        }
        
        /* Top Bar UI */
        #top-ui {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 5;
            pointer-events: none; /* Let clicks pass through to canvas if needed */
        }
        
        .ui-panel {
            background: rgba(0, 20, 50, 0.7);
            border: 1px solid #00aaff;
            border-radius: 8px;
            padding: 5px 15px;
            box-shadow: 0 0 10px rgba(0, 150, 255, 0.3);
            pointer-events: auto;
        }
        
        .btn {
            background: linear-gradient(to bottom, #0088ff, #0055aa);
            color: white;
            border: 1px solid #00ccff;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            margin: 10px;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }
        .btn:hover {
            background: linear-gradient(to bottom, #00aaff, #0077cc);
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 150, 255, 0.4);
        }
        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        
        /* Character Selection Grid */
        .char-grid {
            display: flex;
            flex-wrap: wrap; /* Allows wrapping on smaller mobile screens */
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .char-card {
            width: 80px;
            height: 80px;
            background: rgba(0, 40, 80, 0.8);
            border: 2px solid #0055aa;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 3rem;
            transition: all 0.2s;
        }
        .char-card:hover {
            border-color: #00aaff;
            box-shadow: 0 0 15px rgba(0, 170, 255, 0.5);
        }
        .char-card.selected {
            border-color: #00ffff;
            background: rgba(0, 80, 150, 0.8);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
            transform: scale(1.1);
        }
        
        #overdrive-bar-container {
            width: 150px;
            height: 10px;
            background-color: #002244;
            border: 1px solid #00aaff;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 5px;
        }
        #overdrive-bar {
            width: 0%;
            height: 100%;
            background-color: #00ffff;
            box-shadow: 0 0 10px #00ffff;
            transition: width 0.1s;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Canvas for the game -->
        <canvas id="gameCanvas"></canvas>
        
        <!-- In-game UI -->
        <div id="top-ui" class="hidden">
            <div class="ui-panel flex flex-col items-center">
                <div class="text-sm text-cyan-300 font-bold uppercase tracking-wider">Deep Freeze Mode</div>
                <div id="overdrive-bar-container">
                    <div id="overdrive-bar"></div>
                </div>
            </div>
            
            <div class="ui-panel flex items-center gap-4">
                <button id="pause-btn" class="text-cyan-300 hover:text-white font-bold text-xl px-2">⏸</button>
                <div class="flex flex-col items-center">
                    <div class="text-xs text-cyan-400">SCORE</div>
                    <div id="score-display" class="text-2xl font-bold">0</div>
                </div>
                <div class="flex flex-col items-center">
                    <div class="text-xs text-cyan-400">COMBO</div>
                    <div id="combo-display" class="text-xl font-bold text-yellow-300">0x</div>
                </div>
            </div>
        </div>

        <!-- Main Menu / Character Selection -->
        <div id="menu-overlay" class="overlay">
            <h1 class="text-5xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-b from-cyan-200 to-blue-600 drop-shadow-[0_0_10px_rgba(0,255,255,0.8)]">FROST SMASH</h1>
            <p class="text-cyan-300 mb-8 tracking-widest uppercase text-sm">Select Your Hero</p>
            
            <div class="char-grid" id="character-selection">
                <!-- Canvases used for full-body character graphics -->
                <div class="char-card selected" data-char="seahorse" title="Seahorse">
                    <canvas class="menu-char-canvas" width="60" height="60" data-char="seahorse"></canvas>
                </div>
                <div class="char-card" data-char="panda" title="Panda">
                    <canvas class="menu-char-canvas" width="60" height="60" data-char="panda"></canvas>
                </div>
                <div class="char-card" data-char="human" title="Human">
                    <canvas class="menu-char-canvas" width="60" height="60" data-char="human"></canvas>
                </div>
                <div class="char-card" data-char="robot" title="Robot">
                    <canvas class="menu-char-canvas" width="60" height="60" data-char="robot"></canvas>
                </div>
            </div>
            
            <button id="start-btn" class="btn mt-4 px-12 py-4 text-xl">Start Game</button>
        </div>

        <!-- Pause Menu -->
        <div id="pause-overlay" class="overlay hidden">
            <h2 class="text-4xl font-bold text-white mb-8 drop-shadow-[0_0_10px_rgba(0,150,255,0.8)]">PAUSED</h2>
            <button id="resume-btn" class="btn w-48 mb-4">Resume</button>
            <button id="restart-btn" class="btn w-48 mb-4">Restart</button>
            <button id="main-menu-btn" class="btn w-48">Main Menu</button>
        </div>

        <!-- Game Over Menu -->
        <div id="game-over-overlay" class="overlay hidden">
            <h2 class="text-5xl font-black text-red-400 mb-2 drop-shadow-[0_0_15px_rgba(255,0,0,0.8)]">FROZEN</h2>
            <div class="text-xl text-white mb-2">Score: <span id="final-score" class="font-bold text-cyan-300">0</span></div>
            <div class="text-lg text-gray-300 mb-8">Best: <span id="best-score" class="font-bold">0</span></div>
            
            <button id="retry-btn" class="btn w-48 mb-4">Play Again</button>
            <button id="go-menu-btn" class="btn w-48">Menu</button>
        </div>
    </div>

    <script>
        // --- Game Constants & Variables ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Define logical game resolution, we'll scale it to fit screen
        const GAME_WIDTH = 600;
        const GAME_HEIGHT = 800;
        
        // State
        let gameState = 'MENU'; // MENU, PLAYING, PAUSED, GAMEOVER
        let animationId;
        let lastTime = 0;
        
        // Game Logic Variables
        let score = 0;
        let highScore = localStorage.getItem('frostSmashHighScore') || 0;
        let combo = 0;
        let overdriveLevel = 0;
        const OVERDRIVE_THRESHOLD = 100;
        let isOverdriveActive = false;
        let overdriveTimer = 0;
        
        let frames = 0;
        let gameSpeed = 3;
        
        // Characters definitions (Updated for full body rendering)
        const characters = {
            seahorse: { width: 50, height: 60, color: '#00ffff' },
            panda:    { width: 50, height: 60, color: '#ffffff' },
            human:    { width: 45, height: 60, color: '#ffccaa' },
            robot:    { width: 50, height: 60, color: '#aaaaaa' }
        };
        let selectedChar = 'seahorse';
        
        // Entities
        let player;
        let pipes = [];
        let particles = [];
        let floatingTexts = [];
        let backgroundStars = [];
        
        // Input
        let spacePressed = false;
        
        // DOM Elements
        const menuOverlay = document.getElementById('menu-overlay');
        const pauseOverlay = document.getElementById('pause-overlay');
        const gameOverOverlay = document.getElementById('game-over-overlay');
        const topUI = document.getElementById('top-ui');
        
        const scoreDisplay = document.getElementById('score-display');
        const comboDisplay = document.getElementById('combo-display');
        const overdriveBar = document.getElementById('overdrive-bar');
        const finalScoreDisplay = document.getElementById('final-score');
        const bestScoreDisplay = document.getElementById('best-score');

        // --- Classes ---
        class Player {
            constructor() {
                this.reset();
            }
            
            reset() {
                let charData = characters[selectedChar];
                this.width = charData.width;
                this.height = charData.height;
                this.x = GAME_WIDTH / 4;
                this.y = GAME_HEIGHT / 2;
                this.velocity = 0;
                this.gravity = 0.5;
                this.jumpStrength = -9; // Slightly stronger jump to compensate for larger body
                this.color = charData.color;
                this.rotation = 0;
                this.isInvincible = false;
            }
            
            jump() {
                this.velocity = this.jumpStrength;
                // Add a little visual effect
                createExplosion(this.x, this.y + this.height/2, this.color, 5, 2);
            }
            
            update() {
                // Physics
                this.velocity += this.gravity;
                this.y += this.velocity;
                
                // Rotation based on velocity
                if (this.velocity < 0) {
                    this.rotation = -Math.PI / 8; // Tilt up
                } else {
                    this.rotation = Math.min(Math.PI / 4, (this.velocity / 15) * (Math.PI / 2)); // Tilt down
                }
                
                // Floor collision (Adjusted for full body height)
                if (this.y + this.height/2 >= GAME_HEIGHT) {
                    this.y = GAME_HEIGHT - this.height/2;
                    gameOver();
                }
                
                // Ceiling collision
                if (this.y - this.height/2 <= 0) {
                    this.y = this.height/2;
                    this.velocity = 0;
                }
                
                // Emit trail particles
                if (frames % 3 === 0 && isOverdriveActive) {
                    particles.push(new Particle(this.x, this.y, 0, 0, this.color, 15, 0.05, true));
                }
            }
            
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                // Draw shield if overdrive active
                if (isOverdriveActive) {
                    ctx.beginPath();
                    ctx.arc(0, 0, Math.max(this.width, this.height) * 0.8, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(0, 255, 255, 0.3)';
                    ctx.fill();
                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
                
                // Draw Full Body Character
                drawCharacter(ctx, selectedChar, this.width, this.height, this.color);
                
                ctx.restore();
            }
        }

        class Pipe {
            constructor() {
                this.width = 80;
                this.gap = 200 - (combo * 2); // Gap gets slightly smaller with combo
                if(this.gap < 120) this.gap = 120;
                
                this.x = GAME_WIDTH;
                // Min height for top pipe is 50, max is GAME_HEIGHT - gap - 50
                this.topHeight = Math.random() * (GAME_HEIGHT - this.gap - 100) + 50;
                this.bottomY = this.topHeight + this.gap;
                this.bottomHeight = GAME_HEIGHT - this.bottomY;
                
                this.passed = false;
                this.smashed = false;
                
                // Block graphics
                this.color = '#0055aa';
                this.borderColor = '#00aaff';
            }
            
            update() {
                this.x -= gameSpeed * (isOverdriveActive ? 2 : 1); // Move faster in overdrive
                
                // Check if player passed
                if (!this.passed && !this.smashed && this.x + this.width < player.x) {
                    this.passed = true;
                    addScore(10);
                    combo++;
                    increaseOverdrive(10);
                }
            }
            
            draw(ctx) {
                if (this.smashed) return;
                
                ctx.fillStyle = this.color;
                ctx.strokeStyle = this.borderColor;
                ctx.lineWidth = 4;
                
                // Top pipe
                ctx.fillRect(this.x, 0, this.width, this.topHeight);
                ctx.strokeRect(this.x, 0, this.width, this.topHeight);
                // Top cap
                ctx.fillRect(this.x - 5, this.topHeight - 20, this.width + 10, 20);
                ctx.strokeRect(this.x - 5, this.topHeight - 20, this.width + 10, 20);
                
                // Bottom pipe
                ctx.fillRect(this.x, this.bottomY, this.width, this.bottomHeight);
                ctx.strokeRect(this.x, this.bottomY, this.width, this.bottomHeight);
                // Bottom cap
                ctx.fillRect(this.x - 5, this.bottomY, this.width + 10, 20);
                ctx.strokeRect(this.x - 5, this.bottomY, this.width + 10, 20);
                
                // Adding some inner details to look like ice blocks
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.fillRect(this.x + 5, 5, 10, this.topHeight - 30);
                ctx.fillRect(this.x + 5, this.bottomY + 25, 10, this.bottomHeight - 30);
            }
            
            smash() {
                this.smashed = true;
                // Create particles for top pipe
                createExplosion(this.x + this.width/2, this.topHeight, '#00ffff', 20);
                // Create particles for bottom pipe
                createExplosion(this.x + this.width/2, this.bottomY, '#00ffff', 20);
                
                spawnFloatingText(this.x, player.y, "FROST SMASH!", "#00ffff");
                addScore(50); // Bonus score for smashing
                
                // Screen shake effect could be added here
            }
        }

        class Particle {
            constructor(x, y, vx, vy, color, size, fadeRate, isGlow = false) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.size = size;
                this.alpha = 1;
                this.fadeRate = fadeRate;
                this.isGlow = isGlow;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.fadeRate;
                this.size *= 0.95; // shrink
            }
            
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                if (this.isGlow) {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = this.color;
                }
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0, this.size), 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class FloatingText {
            constructor(x, y, text, color) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.color = color;
                this.alpha = 1;
                this.vy = -1; // float up
            }
            
            update() {
                this.y += this.vy;
                this.alpha -= 0.02;
            }
            
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.font = "bold 20px Arial";
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 5;
                ctx.shadowColor = '#000';
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }
        
        // --- Helper Functions ---
        
        // --- Full Body Character Drawing Logic ---
        function drawCharacter(ctx, charType, w, h, color) {
            ctx.save();
            ctx.translate(-w/2, -h/2); // Draw from top-left relative to center
            
            switch(charType) {
                case 'seahorse':
                    ctx.fillStyle = color;
                    ctx.beginPath(); ctx.arc(w*0.5, h*0.25, w*0.3, 0, Math.PI*2); ctx.fill(); // Head
                    ctx.fillRect(w*0.6, h*0.2, w*0.4, h*0.15); // Snout
                    ctx.beginPath(); ctx.ellipse(w*0.45, h*0.6, w*0.35, h*0.3, 0, 0, Math.PI*2); ctx.fill(); // Body
                    // Tail
                    ctx.beginPath(); ctx.arc(w*0.4, h*0.85, w*0.2, 0, Math.PI);
                    ctx.lineWidth = w*0.15; ctx.strokeStyle = color; ctx.stroke();
                    // Eye
                    ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(w*0.65, h*0.2, w*0.1, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(w*0.7, h*0.2, w*0.05, 0, Math.PI*2); ctx.fill();
                    // Fin
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.beginPath(); ctx.moveTo(w*0.1, h*0.5); ctx.lineTo(w*0.3, h*0.4); ctx.lineTo(w*0.3, h*0.7); ctx.fill();
                    break;
                    
                case 'panda':
                    ctx.fillStyle = 'white';
                    ctx.beginPath(); ctx.ellipse(w*0.5, h*0.65, w*0.45, h*0.35, 0, 0, Math.PI*2); ctx.fill(); // Body
                    ctx.fillStyle = '#222';
                    ctx.beginPath(); ctx.ellipse(w*0.15, h*0.6, w*0.15, h*0.2, -Math.PI/4, 0, Math.PI*2); ctx.fill(); // Arm L
                    ctx.beginPath(); ctx.ellipse(w*0.85, h*0.6, w*0.15, h*0.2, Math.PI/4, 0, Math.PI*2); ctx.fill(); // Arm R
                    ctx.beginPath(); ctx.ellipse(w*0.3, h*0.95, w*0.15, h*0.15, 0, 0, Math.PI*2); ctx.fill(); // Leg L
                    ctx.beginPath(); ctx.ellipse(w*0.7, h*0.95, w*0.15, h*0.15, 0, 0, Math.PI*2); ctx.fill(); // Leg R
                    ctx.fillStyle = 'white';
                    ctx.beginPath(); ctx.arc(w*0.5, h*0.3, w*0.35, 0, Math.PI*2); ctx.fill(); // Head
                    ctx.fillStyle = '#222';
                    ctx.beginPath(); ctx.arc(w*0.2, h*0.15, w*0.12, 0, Math.PI*2); ctx.fill(); // Ear L
                    ctx.beginPath(); ctx.arc(w*0.8, h*0.15, w*0.12, 0, Math.PI*2); ctx.fill(); // Ear R
                    ctx.beginPath(); ctx.ellipse(w*0.35, h*0.3, w*0.1, h*0.08, -Math.PI/4, 0, Math.PI*2); ctx.fill(); // Eye L patch
                    ctx.beginPath(); ctx.ellipse(w*0.65, h*0.3, w*0.1, h*0.08, Math.PI/4, 0, Math.PI*2); ctx.fill(); // Eye R patch
                    ctx.fillStyle = 'white';
                    ctx.beginPath(); ctx.arc(w*0.35, h*0.3, w*0.03, 0, Math.PI*2); ctx.fill(); // Eye L
                    ctx.beginPath(); ctx.arc(w*0.65, h*0.3, w*0.03, 0, Math.PI*2); ctx.fill(); // Eye R
                    ctx.fillStyle = '#222';
                    ctx.beginPath(); ctx.arc(w*0.5, h*0.4, w*0.05, 0, Math.PI*2); ctx.fill(); // Nose
                    break;
                    
                case 'human':
                    ctx.fillStyle = color; // Skin
                    ctx.beginPath(); ctx.arc(w*0.5, h*0.2, w*0.2, 0, Math.PI*2); ctx.fill(); // Head
                    ctx.fillStyle = '#0055ff'; // Shirt
                    ctx.fillRect(w*0.3, h*0.4, w*0.4, h*0.35); // Torso
                    ctx.fillStyle = '#002288'; // Pants
                    ctx.fillRect(w*0.3, h*0.75, w*0.15, h*0.25); // Leg L
                    ctx.fillRect(w*0.55, h*0.75, w*0.15, h*0.25); // Leg R
                    ctx.fillStyle = '#0055ff'; // Sleeve
                    ctx.fillRect(w*0.1, h*0.4, w*0.2, h*0.12); // Arm L
                    ctx.fillRect(w*0.7, h*0.4, w*0.2, h*0.12); // Arm R
                    ctx.fillStyle = color; // Hands
                    ctx.beginPath(); ctx.arc(w*0.05, h*0.46, w*0.08, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(w*0.95, h*0.46, w*0.08, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = 'black';
                    ctx.beginPath(); ctx.arc(w*0.6, h*0.15, w*0.04, 0, Math.PI*2); ctx.fill(); // Eye
                    break;
                    
                case 'robot':
                    ctx.fillStyle = '#888';
                    ctx.fillRect(w*0.25, h*0.1, w*0.5, h*0.35); // Head
                    ctx.fillRect(w*0.45, h*0.0, w*0.1, h*0.1); // Antenna base
                    ctx.fillStyle = '#ff0055';
                    ctx.beginPath(); ctx.arc(w*0.5, h*0.0, w*0.08, 0, Math.PI*2); ctx.fill(); // Antenna bulb
                    ctx.fillStyle = '#aaa';
                    ctx.fillRect(w*0.2, h*0.5, w*0.6, h*0.35); // Body
                    ctx.fillStyle = '#666';
                    ctx.fillRect(w*0.25, h*0.85, w*0.15, h*0.15); // Leg L
                    ctx.fillRect(w*0.6, h*0.85, w*0.15, h*0.15); // Leg R
                    ctx.fillRect(w*0.05, h*0.55, w*0.15, h*0.1); // Arm L
                    ctx.fillRect(w*0.8, h*0.55, w*0.15, h*0.1); // Arm R
                    ctx.fillStyle = '#00ffff'; // Eye visor
                    ctx.fillRect(w*0.5, h*0.2, w*0.2, h*0.1);
                    break;
            }
            ctx.restore();
        }

        function renderMenuPreviews() {
            document.querySelectorAll('.menu-char-canvas').forEach(canvas => {
                const charType = canvas.getAttribute('data-char');
                const cCtx = canvas.getContext('2d');
                const charData = characters[charType];
                cCtx.clearRect(0, 0, canvas.width, canvas.height);
                cCtx.save();
                cCtx.translate(canvas.width/2, canvas.height/2 + 5); 
                // Draw character slightly scaled down to fit nicely in menu
                drawCharacter(cCtx, charType, charData.width * 0.8, charData.height * 0.8, charData.color);
                cCtx.restore();
            });
        }

        function resizeCanvas() {
            // Calculate scale to fit screen while maintaining aspect ratio
            const scaleX = window.innerWidth / GAME_WIDTH;
            const scaleY = window.innerHeight / GAME_HEIGHT;
            const scale = Math.min(scaleX, scaleY) * 0.95; // 95% to leave a tiny margin
            
            canvas.width = GAME_WIDTH;
            canvas.height = GAME_HEIGHT;
            
            // Apply CSS transform for scaling
            canvas.style.transform = `scale(${scale})`;
        }
        
        window.addEventListener('resize', resizeCanvas);
        
        function createExplosion(x, y, color, count, speedOffset = 5) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * speedOffset;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                const size = Math.random() * 8 + 2;
                particles.push(new Particle(x, y, vx, vy, color, size, 0.02 + Math.random()*0.03));
            }
        }
        
        function spawnFloatingText(x, y, text, color) {
            floatingTexts.push(new FloatingText(x, y, text, color));
        }

        function addScore(amount) {
            let actualAmount = amount;
            if (combo > 5) actualAmount += Math.floor(combo / 5) * 5; // Combo bonus
            score += actualAmount;
            
            // Update UI
            scoreDisplay.innerText = score;
            comboDisplay.innerText = combo + 'x';
            
            // Animation effect on text
            scoreDisplay.style.transform = 'scale(1.5)';
            scoreDisplay.style.color = '#fff';
            setTimeout(() => {
                scoreDisplay.style.transform = 'scale(1)';
                scoreDisplay.style.color = '';
            }, 100);
            
            if (amount > 0) {
                spawnFloatingText(player.x + 30, player.y - 20, "+" + actualAmount, "#00ff00");
            }
        }

        function increaseOverdrive(amount) {
            if (isOverdriveActive) return; // Don't increase while active
            
            overdriveLevel += amount;
            if (overdriveLevel >= OVERDRIVE_THRESHOLD) {
                overdriveLevel = OVERDRIVE_THRESHOLD;
                activateOverdrive();
            }
            updateOverdriveUI();
        }

        function activateOverdrive() {
            isOverdriveActive = true;
            overdriveTimer = 300; // frames to last (approx 5 seconds at 60fps)
            topUI.querySelector('.text-cyan-300.font-bold').innerText = "GLACIAL BURST!";
            topUI.querySelector('.text-cyan-300.font-bold').classList.add('text-white', 'drop-shadow-[0_0_8px_#00ffff]');
            
            // Visual effect
            document.getElementById('game-container').style.boxShadow = "inset 0 0 50px rgba(0, 255, 255, 0.5)";
        }
        
        function deactivateOverdrive() {
            isOverdriveActive = false;
            overdriveLevel = 0;
            topUI.querySelector('.text-cyan-300.font-bold').innerText = "DEEP FREEZE MODE";
            topUI.querySelector('.text-cyan-300.font-bold').classList.remove('text-white', 'drop-shadow-[0_0_8px_#00ffff]');
            updateOverdriveUI();
            
            document.getElementById('game-container').style.boxShadow = "none";
        }

        function updateOverdriveUI() {
            const pct = (overdriveLevel / OVERDRIVE_THRESHOLD) * 100;
            overdriveBar.style.width = pct + '%';
            if(isOverdriveActive) {
                overdriveBar.style.backgroundColor = '#ffffff';
            } else {
                overdriveBar.style.backgroundColor = '#00ffff';
            }
        }

        function checkCollision(pipe) {
            // Buffer for forgiving collision (hitbox slightly smaller than graphic)
            const buffer = 10;
            
            // Circle to Rectangle rough collision
            // Player is roughly a circle at player.x, player.y with radius player.width/2
            
            let pRight = player.x + player.width/2 - buffer;
            let pLeft = player.x - player.width/2 + buffer;
            let pTop = player.y - player.height/2 + buffer;
            let pBottom = player.y + player.height/2 - buffer;
            
            let pipeRight = pipe.x + pipe.width;
            let pipeLeft = pipe.x;
            
            // Check x-axis overlap
            if (pRight > pipeLeft && pLeft < pipeRight) {
                // Check y-axis overlap (hit top pipe or hit bottom pipe)
                if (pTop < pipe.topHeight || pBottom > pipe.bottomY) {
                    return true;
                }
            }
            return false;
        }

        function initBackground() {
            backgroundStars = [];
            for (let i = 0; i < 50; i++) {
                backgroundStars.push({
                    x: Math.random() * GAME_WIDTH,
                    y: Math.random() * GAME_HEIGHT,
                    size: Math.random() * 2 + 1,
                    speed: Math.random() * 0.5 + 0.1
                });
            }
        }

        function drawBackground(ctx) {
            // Gradient already handled by canvas CSS, just draw stars/particles
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            backgroundStars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Move stars slightly based on game speed to give depth
                if (gameState === 'PLAYING') {
                     star.x -= star.speed * (isOverdriveActive ? 3 : 1);
                     if (star.x < 0) {
                         star.x = GAME_WIDTH;
                         star.y = Math.random() * GAME_HEIGHT;
                     }
                }
            });
        }

        // --- Game Flow Control ---

        function initGame() {
            player = new Player();
            pipes = [];
            particles = [];
            floatingTexts = [];
            score = 0;
            combo = 0;
            overdriveLevel = 0;
            isOverdriveActive = false;
            frames = 0;
            gameSpeed = 3;
            
            scoreDisplay.innerText = '0';
            comboDisplay.innerText = '0x';
            updateOverdriveUI();
            initBackground();
        }

        function startGame() {
            initGame();
            gameState = 'PLAYING';
            
            menuOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            pauseOverlay.classList.add('hidden');
            topUI.classList.remove('hidden');
            
            if (!animationId) {
                lastTime = performance.now();
                gameLoop(lastTime);
            }
            
            // Initial jump
            player.jump();
        }

        function pauseGame() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                pauseOverlay.classList.remove('hidden');
            }
        }

        function resumeGame() {
            if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                pauseOverlay.classList.add('hidden');
                lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            }
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            
            createExplosion(player.x, player.y, player.color, 30, 8);
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('frostSmashHighScore', highScore);
            }
            
            finalScoreDisplay.innerText = score;
            bestScoreDisplay.innerText = highScore;
            
            setTimeout(() => {
                topUI.classList.add('hidden');
                gameOverOverlay.classList.remove('hidden');
            }, 500); // slight delay to see explosion
        }

        function showMainMenu() {
            gameState = 'MENU';
            pauseOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            topUI.classList.add('hidden');
            menuOverlay.classList.remove('hidden');
            
            // Draw initial background
            initBackground();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground(ctx);
        }

        // --- Main Loop ---
        function gameLoop(timestamp) {
            // Delta time calculation for smooth movement (optional, keeping it simple frame-based for now)
            // const dt = timestamp - lastTime;
            lastTime = timestamp;
            
            if (gameState !== 'PLAYING') {
                if(gameState === 'GAMEOVER') {
                    // Just render particles finishing
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    drawBackground(ctx);
                    
                    // Draw pipes (static)
                    pipes.forEach(p => p.draw(ctx));
                    
                    // Update & Draw particles
                    for (let i = particles.length - 1; i >= 0; i--) {
                        particles[i].update();
                        particles[i].draw(ctx);
                        if (particles[i].alpha <= 0) particles.splice(i, 1);
                    }
                }
                animationId = requestAnimationFrame(gameLoop);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Background
            drawBackground(ctx);

            // Handle Overdrive state
            if (isOverdriveActive) {
                overdriveTimer--;
                overdriveLevel = (overdriveTimer / 300) * OVERDRIVE_THRESHOLD; // Visual bar decrase
                updateOverdriveUI();
                
                if (overdriveTimer <= 0) {
                    deactivateOverdrive();
                }
            }

            // Pipe Spawning
            if (frames % 100 === 0) {
                pipes.push(new Pipe());
            }

            // Update & Draw Pipes
            for (let i = pipes.length - 1; i >= 0; i--) {
                let p = pipes[i];
                p.update();
                p.draw(ctx);
                
                // Collision Logic
                if (!p.smashed && checkCollision(p)) {
                    if (isOverdriveActive) {
                        p.smash(); // Smash through if in overdrive
                    } else {
                        gameOver();
                    }
                }
                
                // Remove off-screen pipes
                if (p.x + p.width < 0) {
                    if(!p.passed && !p.smashed) {
                        // Missed pipe resets combo
                        combo = 0;
                        comboDisplay.innerText = '0x';
                    }
                    pipes.splice(i, 1);
                }
            }
            
            // Draw Pipe Smash Particles above pipes but below player
            // Player Update & Draw
            player.update();
            player.draw(ctx);

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw(ctx);
                if (particles[i].alpha <= 0) particles.splice(i, 1);
            }
            
            // Floating Texts
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                floatingTexts[i].update();
                floatingTexts[i].draw(ctx);
                if (floatingTexts[i].alpha <= 0) floatingTexts.splice(i, 1);
            }

            // Input Handling (continuous for smooth jump feeling if held)
            // But flappy usually requires distinct taps.
            
            // Difficulty increase
            if (frames % 500 === 0 && gameSpeed < 6) {
                gameSpeed += 0.2;
            }

            frames++;
            animationId = requestAnimationFrame(gameLoop);
        }

        // --- Event Listeners ---
        
        function handleInput(e) {
            if (e.type === 'keydown' && e.code !== 'Space') return;
            if (e.type === 'keydown') e.preventDefault(); // Prevent scrolling
            
            if (gameState === 'PLAYING') {
                player.jump();
            } else if (gameState === 'MENU') {
                // startGame(); // Handled by button now
            } else if (gameState === 'GAMEOVER') {
                // Don't auto restart on tap, let them use buttons to prevent accidental restarts
            }
        }
        
        // Keyboard
        window.addEventListener('keydown', handleInput);
        
        // Touch / Mouse (Canvas area)
        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); // prevent mouse emulation and scrolling
            handleInput(e);
        }, {passive: false});

        // UI Buttons
        document.getElementById('start-btn').addEventListener('click', startGame);
        
        document.getElementById('pause-btn').addEventListener('click', (e) => {
            e.stopPropagation(); // Prevent jump
            pauseGame();
        });
        
        document.getElementById('resume-btn').addEventListener('click', resumeGame);
        
        document.getElementById('restart-btn').addEventListener('click', startGame);
        
        document.getElementById('main-menu-btn').addEventListener('click', showMainMenu);
        
        document.getElementById('retry-btn').addEventListener('click', startGame);
        
        document.getElementById('go-menu-btn').addEventListener('click', showMainMenu);

        // Character Selection Logic
        document.querySelectorAll('.char-card').forEach(card => {
            card.addEventListener('click', function() {
                // Remove selected class from all
                document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
                // Add to clicked
                this.classList.add('selected');
                // Update variable
                selectedChar = this.getAttribute('data-char');
            });
        });

        // --- Initialization ---
        resizeCanvas();
        renderMenuPreviews();
        showMainMenu(); // Setup initial state and draw background

    </script>
</body>
</html>
