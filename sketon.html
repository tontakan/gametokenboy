<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LeptoRun Ultimate Skills</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        body {
            margin: 0; overflow: hidden;
            background-color: #cbd5e1; /* สีฟ้าหม่น/เทาแบบฉากหลัง */
            font-family: 'VT323', monospace;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(255,255,255,0.9);
            z-index: 20; color: #000;
        }
        .hidden { display: none !important; }

        .btn {
            background: #fff; border: 4px solid #000; color: #000;
            padding: 10px 40px; font-size: 2rem; cursor: pointer;
            text-transform: uppercase; margin: 10px; font-family: 'VT323', monospace;
            transition: all 0.1s; box-shadow: 4px 4px 0 #000;
        }
        .btn:active { background: #000; color: #fff; box-shadow: 0px 0px 0 #000; transform: translate(4px, 4px); }

        .title-box {
            border: 4px solid #000; padding: 20px 60px; text-align: center;
            margin-bottom: 40px; background: #fff; box-shadow: 8px 8px 0 #000;
        }

        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }
        .hud-top { display: flex; justify-content: space-between; align-items: flex-start; padding: 15px; }
        .hud-left { display: flex; flex-direction: column; gap: 5px; }
        
        .hud-btn {
            background: #fff; border: 3px solid #000; padding: 5px 20px;
            font-size: 1.5rem; pointer-events: auto; cursor: pointer; text-align: center;
            box-shadow: 2px 2px 0 #000;
        }
        .stat-box {
            background: #fff; border: 3px solid #000; padding: 5px 10px;
            font-size: 1.5rem; display: flex; align-items: center; gap: 10px;
            box-shadow: 2px 2px 0 #000; margin-top: 5px;
        }

        /* Infection Bar - Center */
        .infection-container {
            width: 300px; text-align: center; background: #fff;
            padding: 5px; border: 3px solid #000; box-shadow: 4px 4px 0 #000;
        }
        .infection-text { font-size: 1.2rem; font-weight: bold; margin-bottom: 2px; }
        .infection-bar-bg { border: 2px solid #000; height: 20px; background: #e2e8f0; position: relative; }
        .infection-bar-fill { background: #ef4444; height: 100%; width: 0%; transition: width 0.1s; }

        .timer-box {
            font-size: 2rem; font-weight: bold; background: #fff; border: 3px solid #000;
            padding: 5px 15px; box-shadow: 2px 2px 0 #000;
        }

        .weapon-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 30px; }
        .weapon-card {
            border: 4px solid #000; padding: 20px; text-align: center;
            cursor: pointer; font-size: 1.8rem; background: #fff; width: 200px;
            box-shadow: 4px 4px 0 #000;
        }
        .weapon-card.selected { background: #000; color: #fff; box-shadow: 0px 0px 0 #000; transform: translate(4px, 4px); }

        /* Guide */
        #controls-guide {
            position: absolute; bottom: 10%; left: 0; width: 100%;
            display: flex; justify-content: space-between; padding: 0 10%;
            pointer-events: none; opacity: 0.7; transition: opacity 1s;
        }
        .guide-box { border: 2px dashed #000; padding: 10px; font-size: 1.5rem; background: rgba(255,255,255,0.8); }

    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="hud" class="hidden">
            <div class="hud-top">
                <div class="hud-left">
                    <div class="hud-btn" id="btn-pause">MENU</div>
                    <div class="stat-box"><span>💀</span><span id="score-txt">0</span></div>
                </div>
                
                <div class="infection-container">
                    <div class="infection-text">INFECTION</div>
                    <div class="infection-bar-bg"><div id="infection-fill" class="infection-bar-fill"></div></div>
                    <div class="infection-text" id="infection-status">TIDE RISING</div>
                </div>

                <div class="timer-box" id="timer-txt">0:00M</div>
            </div>
            <div id="controls-guide">
                <div class="guide-box">👈 TAP TO JUMP</div>
                <div class="guide-box">DRAG TO AIM & SHOOT 👉</div>
            </div>
        </div>

        <div id="menu-screen" class="overlay">
            <div class="title-box">
                <h1 class="text-6xl mb-0">LEPTORUN</h1>
                <p class="text-3xl mb-2">Weapons & Mobile Controls</p>
            </div>
            <button id="btn-start" class="btn">START GAME</button>
            <button id="btn-weapon-menu" class="btn">WEAPON: BOW</button>
        </div>

        <div id="weapon-screen" class="overlay hidden">
            <h2 class="text-5xl mb-8 border-b-4 border-black pb-2">CHOOSE WEAPON</h2>
            <div class="weapon-grid">
                <div class="weapon-card" data-weapon="HAMMER">HAMMER<br><span class="text-sm">MELEE</span></div>
                <div class="weapon-card" data-weapon="SWORD">SWORD<br><span class="text-sm">MELEE</span></div>
                <div class="weapon-card" data-weapon="AXE">AXE<br><span class="text-sm">MELEE</span></div>
                <div class="weapon-card selected" data-weapon="BOW">BOW<br><span class="text-sm">RANGED</span></div>
            </div>
            <button id="btn-back-menu" class="btn">BACK</button>
        </div>
        
        <div id="gameover-screen" class="overlay hidden">
            <h2 class="text-6xl mb-4 bg-black text-white px-4">INFECTION CRITICAL</h2>
            <p id="final-time" class="text-3xl mb-2">Survived: 0:00M</p>
            <p id="final-score" class="text-3xl mb-8">Kills: 0</p>
            <button id="btn-restart" class="btn">RESTART</button>
            <button id="btn-quit" class="btn">MAIN MENU</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let cw, ch;
        
        // Game State
        let gameState = 'MENU'; // MENU, PLAY, PAUSE, GAMEOVER
        let animId;
        let currentWeapon = 'BOW';
        let startTime = 0; let pauseTime = 0; let totalPausedMs = 0;
        let score = 0; let infection = 0;
        
        // World
        let cameraX = 0;
        let runSpeed = 7;
        let platforms = [];
        let backgroundBuildings = [];
        let nextPlatformX = 0;
        let floorY = 0; // Base reference for ground

        // Entities
        let player;
        let enemies = [];
        let projectiles = [];
        let effects = [];

        // Mobile Controls (Joystick)
        let joyActive = false;
        let joyOrigin = {x: 0, y: 0};
        let joyCurr = {x: 0, y: 0};
        let joyTouchId = null;

        class Player {
            constructor() {
                this.w = 40; this.h = 80; // Hitbox
                this.x = 200; this.y = ch/2;
                this.vy = 0; this.gravity = 0.8; this.jumpForce = -16;
                this.isGrounded = false; this.dead = false;
                this.lastAtk = 0;
            }

            jump() {
                if (this.isGrounded && !this.dead) {
                    this.vy = this.jumpForce;
                    this.isGrounded = false;
                }
            }

            attack(dx, dy) {
                if (this.dead || Date.now() - this.lastAtk < 400) return;
                this.lastAtk = Date.now();
                
                let angle = Math.atan2(dy, dx);
                if (dx === 0 && dy === 0) angle = 0;

                let atkX = this.x + this.w/2; let atkY = this.y + this.h/2 - 20;

                if (currentWeapon === 'BOW') {
                    projectiles.push(new Projectile(atkX, atkY, angle));
                } else {
                    effects.push(new Slash(atkX, atkY, angle, currentWeapon));
                    this.checkMeleeHit(angle);
                }
            }

            checkMeleeHit(angle) {
                let reach = currentWeapon === 'HAMMER' ? 120 : 90;
                let hitBox = {
                    x: this.x + this.w/2 + Math.cos(angle)*reach/2 - reach/2,
                    y: this.y + this.h/2 - 20 + Math.sin(angle)*reach/2 - reach/2,
                    w: reach, h: reach
                };
                
                enemies.forEach(e => {
                    if (!e.marked && rectIntersect(hitBox, e)) {
                        e.marked = true; addScore();
                    }
                });
            }

            update() {
                if (this.dead) return;

                this.vy += this.gravity;
                let nextY = this.y + this.vy;
                let nextX = this.x + runSpeed;

                // Platform Collision
                let groundY = null;
                for (let p of platforms) {
                    // Check horizontal bounds
                    if (nextX + this.w > p.x && nextX < p.x + p.w) {
                        // Check falling onto top
                        if (this.y + this.h <= p.y + 15 && nextY + this.h >= p.y) {
                            groundY = p.y; break;
                        }
                    }
                }

                if (groundY !== null) {
                    this.y = groundY - this.h;
                    this.vy = 0; this.isGrounded = true;
                } else {
                    this.y = nextY; this.isGrounded = false;
                }

                // Wall collision (hit side of building)
                for (let p of platforms) {
                    if (this.x + this.w > p.x && this.x < p.x + p.w && this.y + this.h > p.y + 15) {
                        this.x = p.x - this.w; // Stop moving forward
                        this.die();
                    }
                }

                if (!this.dead) this.x += runSpeed;
                if (this.y > ch + 100) this.die(); // Fall into abyss
            }

            die() {
                if(this.dead) return;
                this.dead = true;
                setTimeout(triggerGameOver, 800);
            }

            draw(ctx, cx) {
                let sx = this.x - cx; let sy = this.y;
                ctx.save();
                ctx.translate(sx + this.w/2, sy + 20); // Center around chest

                // Stickman Draw
                ctx.strokeStyle = '#000'; ctx.lineWidth = 6;
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';

                let time = Date.now() / 120;
                let runCycle = this.isGrounded ? time : 0;
                
                // Head
                ctx.beginPath(); ctx.arc(0, -25, 14, 0, Math.PI*2); 
                ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
                
                // Bandana (Class color indicator)
                ctx.fillStyle = currentWeapon === 'BOW' ? '#3b82f6' : (currentWeapon === 'HAMMER' ? '#eab308' : '#ef4444');
                ctx.fillRect(-12, -32, 24, 6);

                // Body
                ctx.beginPath(); ctx.moveTo(0, -11); ctx.lineTo(0, 30); ctx.stroke();

                // Legs
                let lSwing = Math.sin(runCycle) * 25;
                let kSwing = Math.cos(runCycle) * 15;
                if (!this.isGrounded) { lSwing = -10; kSwing = -20; }
                
                // Back leg
                ctx.beginPath(); ctx.moveTo(0, 30); ctx.lineTo(-10 + lSwing, 45); ctx.lineTo(-15 + lSwing - kSwing, 60); ctx.stroke();
                // Front leg
                ctx.beginPath(); ctx.moveTo(0, 30); ctx.lineTo(-10 - lSwing, 45); ctx.lineTo(-15 - lSwing + kSwing, 60); ctx.stroke();

                // Aiming Angle
                let aimAngle = 0;
                if (joyActive) aimAngle = Math.atan2(joyCurr.y - joyOrigin.y, joyCurr.x - joyOrigin.x);
                else if (!this.isGrounded) aimAngle = Math.PI/8;

                // Arms
                ctx.save();
                ctx.translate(0, -5); ctx.rotate(aimAngle);
                
                // Arm line
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(35, 0); ctx.stroke();
                
                // Draw Weapon
                ctx.translate(35, 0);
                this.drawWeapon(ctx);
                ctx.restore();
                
                ctx.restore();
            }

            drawWeapon(ctx) {
                ctx.lineWidth = 4;
                if (currentWeapon === 'BOW') {
                    ctx.beginPath(); ctx.arc(0, 0, 25, -Math.PI/2, Math.PI/2); ctx.stroke(); // Bow string/arc
                    ctx.beginPath(); ctx.moveTo(0, -25); ctx.lineTo(0, 25); ctx.stroke();
                } else if (currentWeapon === 'SWORD') {
                    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(50, 0); ctx.stroke(); // Blade
                    ctx.beginPath(); ctx.moveTo(10, -10); ctx.lineTo(10, 10); ctx.stroke(); // Guard
                } else if (currentWeapon === 'AXE') {
                    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(40, 0); ctx.stroke(); // Handle
                    ctx.beginPath(); ctx.moveTo(35, -20); ctx.lineTo(40, 0); ctx.lineTo(35, 20); ctx.stroke();
                    ctx.fillStyle = '#000'; ctx.fill(); // Axe head
                } else if (currentWeapon === 'HAMMER') {
                    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(35, 0); ctx.stroke(); // Handle
                    ctx.fillStyle = '#000'; ctx.fillRect(25, -15, 20, 30); // Hammer head
                }
            }
        }

        function generatePlatform() {
            let w = 400 + Math.random() * 500;
            let gap = 150 + Math.random() * 200;
            let y = ch/2 + 50 + (Math.random() * 150 - 75); 
            
            if (platforms.length === 0) { w = cw + 200; gap = 0; y = ch/2 + 100; nextPlatformX = -100; }
            
            platforms.push({x: nextPlatformX + gap, y: y, w: w, h: ch - y + 200});
            
            // Spawn Enemy on roof
            if (platforms.length > 1 && Math.random() > 0.4) {
                let eNum = Math.floor(Math.random() * 2) + 1;
                for(let i=0; i<eNum; i++) {
                    enemies.push(new Enemy(nextPlatformX + gap + w/2 + (i*80), y - 40));
                }
            }
            nextPlatformX += gap + w;
        }

        class Enemy {
            constructor(x, y) {
                this.x = x; this.y = y; this.w = 30; this.h = 40;
                this.marked = false; this.anim = Math.random() * Math.PI;
                this.speed = 1 + Math.random() * 2;
            }
            update() {
                this.x -= this.speed; 
                if (this.x < cameraX - 100) this.marked = true; // Delete offscreen
                
                // Hit player
                if (rectIntersect(this, player) && !player.dead) {
                    infection += 20; 
                    this.marked = true;
                    effects.push(new FloatingText("INFECTED +20", player.x, player.y - 20, '#ef4444'));
                }
            }
            draw(ctx, cx) {
                let sx = this.x - cx;
                this.anim += 0.15;
                let bounce = Math.abs(Math.sin(this.anim)) * 12;
                
                ctx.save();
                ctx.translate(sx + this.w/2, this.y + this.h - bounce);
                ctx.strokeStyle = '#000'; ctx.lineWidth = 5; ctx.lineCap = 'round';
                
                // Enemy stick/blob
                ctx.beginPath(); ctx.arc(0, -20, 15, 0, Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-5, -20); ctx.lineTo(-5, -15); ctx.stroke(); // Eye
                
                // Spiky legs
                ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(-10, 10); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(10, 10); ctx.stroke();
                
                ctx.restore();
            }
        }

        class Projectile {
            constructor(x, y, angle) {
                this.x = x; this.y = y; this.w = 24; this.h = 4;
                this.vx = Math.cos(angle) * 25; this.vy = Math.sin(angle) * 25;
                this.angle = angle; this.marked = false;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.y > ch || this.x > cameraX + cw || this.x < cameraX) this.marked = true;
                
                enemies.forEach(e => {
                    if (!e.marked && rectIntersect(this, e)) {
                        e.marked = true; this.marked = true; addScore();
                    }
                });
            }
            draw(ctx, cx) {
                ctx.save(); ctx.translate(this.x - cx, this.y); ctx.rotate(this.angle);
                ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(24, 0); ctx.stroke();
                ctx.restore();
            }
        }

        class Slash {
            constructor(x, y, angle, type) {
                this.x = x; this.y = y; this.angle = angle;
                this.life = 12; this.marked = false;
            }
            update() { this.life--; if(this.life <= 0) this.marked = true; }
            draw(ctx, cx) {
                ctx.save(); ctx.translate(this.x - cx, this.y); ctx.rotate(this.angle);
                ctx.strokeStyle = `rgba(0,0,0,${this.life/12})`; ctx.lineWidth = 15;
                ctx.beginPath(); ctx.arc(0, 0, 70, -Math.PI/3, Math.PI/3); ctx.stroke();
                ctx.restore();
            }
        }

        class FloatingText {
            constructor(text, x, y, col='#000') {
                this.text = text; this.x = x; this.y = y; this.col = col;
                this.life = 40; this.marked = false;
            }
            update() { this.y -= 1.5; this.life--; if(this.life <= 0) this.marked = true; }
            draw(ctx, cx) {
                ctx.globalAlpha = this.life / 40;
                ctx.fillStyle = this.col; ctx.font = "bold 24px VT323";
                ctx.fillText(this.text, this.x - cx, this.y);
                ctx.globalAlpha = 1;
            }
        }

        function rectIntersect(r1, r2) {
            return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
        }

        function drawWorld() {
            // Background Layer (Parallax Buildings)
            if (backgroundBuildings.length === 0) {
                for(let i=0; i<15; i++) {
                    backgroundBuildings.push({
                        x: i * 150, w: 100 + Math.random()*100, h: 200 + Math.random()*400,
                        col: Math.random() > 0.5 ? '#94a3b8' : '#cbd5e1'
                    });
                }
            }
            
            // Loop BG
            let lastBg = backgroundBuildings[backgroundBuildings.length-1];
            if (cameraX * 0.2 > backgroundBuildings[0].x + backgroundBuildings[0].w) {
                let b = backgroundBuildings.shift();
                b.x = lastBg.x + lastBg.w + 50;
                backgroundBuildings.push(b);
            }

            backgroundBuildings.forEach(b => {
                let sx = b.x - (cameraX * 0.2); // Slow parallax
                ctx.fillStyle = b.col; ctx.fillRect(sx, ch - b.h, b.w, b.h);
                ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2; ctx.strokeRect(sx, ch - b.h, b.w, b.h);
            });

            // Foreground Platforms (Rooftops)
            platforms.forEach(p => {
                let sx = p.x - cameraX;
                if (sx + p.w < 0 || sx > cw) return;
                
                ctx.fillStyle = '#fff'; ctx.fillRect(sx, p.y, p.w, p.h);
                ctx.strokeStyle = '#000'; ctx.lineWidth = 6; ctx.strokeRect(sx, p.y, p.w, p.h);
                
                // Windows Pattern
                ctx.fillStyle = '#e2e8f0';
                for(let wx = 20; wx < p.w - 30; wx += 40) {
                    for(let wy = 30; wy < p.h - 30; wy += 50) {
                        ctx.fillRect(sx + wx, p.y + wy, 20, 30);
                    }
                }
            });
        }

        function drawJoystick() {
            if (!joyActive || gameState !== 'PLAY') return;
            ctx.save();
            
            // Base Ring
            ctx.beginPath(); ctx.arc(joyOrigin.x, joyOrigin.y, 80, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fill();
            ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.stroke();

            // Red Aim Vector
            let dx = joyCurr.x - joyOrigin.x; let dy = joyCurr.y - joyOrigin.y;
            let dist = Math.min(70, Math.hypot(dx, dy));
            let angle = Math.atan2(dy, dx);

            ctx.translate(joyOrigin.x, joyOrigin.y); ctx.rotate(angle);
            
            // Red target circle
            ctx.fillStyle = '#ef4444';
            ctx.beginPath(); ctx.arc(dist, 0, 30, 0, Math.PI*2); ctx.fill();
            
            // White inner arrow
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.moveTo(dist - 8, -10); ctx.lineTo(dist + 12, 0); ctx.lineTo(dist - 8, 10); ctx.fill();

            ctx.restore();
        }

        function addScore() {
            score++; infection = Math.max(0, infection - 8); // Kills heal
            document.getElementById('score-txt').innerText = score;
            effects.push(new FloatingText("KILL", player.x, player.y - 40));
        }

        function updateHUD() {
            let elapsed = Math.floor((Date.now() - startTime - totalPausedMs) / 1000);
            let mins = Math.floor(elapsed / 60); let secs = elapsed % 60;
            document.getElementById('timer-txt').innerText = `${mins}:${secs.toString().padStart(2, '0')}M`;

            infection += 0.08; // Passive increase
            let infPct = Math.min(100, Math.max(0, infection));
            document.getElementById('infection-fill').style.width = infPct + '%';
            
            let statusTxt = document.getElementById('infection-status');
            if (infPct > 80) { statusTxt.innerText = "CRITICAL LIMIT"; statusTxt.style.color = '#ef4444'; }
            else if (infPct > 50) { statusTxt.innerText = "TIDE RISING"; statusTxt.style.color = '#000'; }
            else { statusTxt.innerText = "SAFE"; statusTxt.style.color = '#000'; }

            if (infection >= 100) triggerGameOver();
        }

        function update() {
            if (gameState !== 'PLAY') return;

            player.update();
            cameraX = player.x - 150; 

            // Spawn ahead
            while (nextPlatformX < cameraX + cw + 800) generatePlatform();
            if (platforms[0].x + platforms[0].w < cameraX - 200) platforms.shift();

            enemies.forEach(e => e.update());
            projectiles.forEach(p => p.update());
            effects.forEach(e => e.update());

            enemies = enemies.filter(e => !e.marked);
            projectiles = projectiles.filter(p => !p.marked);
            effects = effects.filter(e => !e.marked);

            updateHUD();
        }

        function draw() {
            ctx.clearRect(0, 0, cw, ch);
            drawWorld();
            
            if (gameState === 'PLAY' || gameState === 'GAMEOVER') {
                enemies.forEach(e => e.draw(ctx, cameraX));
                player.draw(ctx, cameraX);
                projectiles.forEach(p => p.draw(ctx, cameraX));
                effects.forEach(e => e.draw(ctx, cameraX));
                drawJoystick();
            }
        }

        function loop() {
            update(); draw();
            animId = requestAnimationFrame(loop);
        }

        function resize() {
            cw = window.innerWidth; ch = window.innerHeight;
            canvas.width = cw; canvas.height = ch;
        }
        window.addEventListener('resize', resize); resize();

        // Mouse support for desktop testing
        let mouseDown = false;
        canvas.addEventListener('mousedown', (e) => {
            if (gameState !== 'PLAY') return;
            if (e.clientX < cw / 2) player.jump();
            else {
                mouseDown = true; joyActive = true;
                joyOrigin = {x: e.clientX, y: e.clientY}; joyCurr = {x: e.clientX, y: e.clientY};
            }
        });
        canvas.addEventListener('mousemove', (e) => { if (mouseDown) joyCurr = {x: e.clientX, y: e.clientY}; });
        canvas.addEventListener('mouseup', (e) => {
            if (mouseDown) {
                mouseDown = false; joyActive = false;
                player.attack(joyCurr.x - joyOrigin.x, joyCurr.y - joyOrigin.y);
            }
        });

        // Mobile Touch Events
        canvas.addEventListener('touchstart', (e) => {
            if (gameState !== 'PLAY') return;
            e.preventDefault();
            for(let i=0; i<e.changedTouches.length; i++) {
                let t = e.changedTouches[i];
                if (t.clientX < cw / 2) player.jump();
                else {
                    joyActive = true; joyTouchId = t.identifier;
                    joyOrigin = {x: t.clientX, y: t.clientY}; joyCurr = {x: t.clientX, y: t.clientY};
                }
            }
        }, {passive: false});

        canvas.addEventListener('touchmove', (e) => {
            if (gameState !== 'PLAY' || !joyActive) return;
            e.preventDefault();
            for(let i=0; i<e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joyTouchId) {
                    joyCurr = {x: e.changedTouches[i].clientX, y: e.changedTouches[i].clientY};
                }
            }
        }, {passive: false});

        canvas.addEventListener('touchend', (e) => {
            if (gameState !== 'PLAY') return;
            for(let i=0; i<e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joyTouchId && joyActive) {
                    joyActive = false;
                    player.attack(joyCurr.x - joyOrigin.x, joyCurr.y - joyOrigin.y);
                }
            }
        });

        // UI Interactions
        const screens = {
            menu: document.getElementById('menu-screen'),
            weapon: document.getElementById('weapon-screen'),
            hud: document.getElementById('hud'),
            gameover: document.getElementById('gameover-screen')
        };

        function switchScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            if (screens[screenName]) screens[screenName].classList.remove('hidden');
        }

        document.getElementById('btn-weapon-menu').addEventListener('click', () => switchScreen('weapon'));
        document.getElementById('btn-back-menu').addEventListener('click', () => switchScreen('menu'));
        
        document.querySelectorAll('.weapon-card').forEach(card => {
            card.addEventListener('click', () => {
                document.querySelectorAll('.weapon-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                currentWeapon = card.getAttribute('data-weapon');
                document.getElementById('btn-weapon-menu').innerText = `WEAPON: ${currentWeapon}`;
            });
        });

        function startGame() {
            gameState = 'PLAY'; switchScreen('hud');
            
            player = new Player();
            platforms = []; backgroundBuildings = []; nextPlatformX = 0;
            enemies = []; projectiles = []; effects = [];
            score = 0; infection = 0; cameraX = 0;
            joyActive = false; joyTouchId = null;
            
            startTime = Date.now(); totalPausedMs = 0;
            document.getElementById('score-txt').innerText = score;
            generatePlatform(); // Init ground
            
            // Restore hint visibility
            const guide = document.getElementById('controls-guide');
            guide.style.transition = 'none';
            guide.style.opacity = '0.7';
            void guide.offsetWidth; // Force reflow
            guide.style.transition = 'opacity 1s';
            
            if(window.guideTimer) clearTimeout(window.guideTimer);
            window.guideTimer = setTimeout(() => { guide.style.opacity = '0'; }, 4000);
        }

        function triggerGameOver() {
            if (gameState === 'GAMEOVER') return;
            gameState = 'GAMEOVER'; switchScreen('gameover');
            document.getElementById('final-time').innerText = `Survived: ${document.getElementById('timer-txt').innerText}`;
            document.getElementById('final-score').innerText = `Kills: ${score}`;
        }

        // Pause / Resume Logic
        document.getElementById('btn-pause').addEventListener('click', () => {
            if (gameState === 'PLAY') {
                gameState = 'PAUSE'; pauseTime = Date.now();
                switchScreen('menu');
                document.getElementById('btn-start').innerText = "RESUME GAME";
            }
        });

        document.getElementById('btn-start').addEventListener('click', () => {
            if (gameState === 'PAUSE') {
                totalPausedMs += (Date.now() - pauseTime);
                gameState = 'PLAY'; switchScreen('hud');
            } else {
                startGame();
            }
        });

        document.getElementById('btn-restart').addEventListener('click', startGame);
        document.getElementById('btn-quit').addEventListener('click', () => {
            gameState = 'MENU'; switchScreen('menu');
            document.getElementById('btn-start').innerText = "START GAME";
        });

        // Initialize Engine
        switchScreen('menu');
        animId = requestAnimationFrame(loop);

    </script>
</body>
</html>
